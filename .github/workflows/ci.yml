name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.9.0'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Debug Prettier
        run: |
          echo "Node version:"
          node -v

          echo "NPM version:"
          npm -v

          echo "Prettier version:"
          npx prettier --version

          echo "Installed Prettier packages:"
          npm ls prettier prettier-plugin-css-order

          echo "Checking file:"
          npx prettier --check newsletter-worker/worker-configuration.d.ts

          echo "Writing file:"
          npx prettier --write newsletter-worker/worker-configuration.d.ts

          echo "Git diff after write:"
          git --no-pager diff -- newsletter-worker/worker-configuration.d.ts

      - name: Run format check
        run: npm run prettier:check
